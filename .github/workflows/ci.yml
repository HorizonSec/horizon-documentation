name: CI

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main, develop ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Check file formatting
      run: |
        echo "Running basic file checks..."
        # Check for trailing whitespace
        if grep -r --exclude-dir=.git --exclude-dir=node_modules -n '[[:blank:]]$' .; then
          echo "Error: Trailing whitespace found"
          exit 1
        fi
        echo "File formatting checks passed!"

    - name: Validate Markdown
      uses: actionshub/markdownlint@main
      continue-on-error: true

    - name: Check for large files
      run: |
        echo "Checking for large files..."
        large_files=$(find . -type f -size +10M -not -path "./.git/*")
        if [ -n "$large_files" ]; then
          echo "Warning: Large files found:"
          echo "$large_files"
        else
          echo "No large files found"
        fi

  test:
    name: Test
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify required files
      run: |
        echo "Verifying required documentation files exist..."
        required_files=(
          "README.md"
          "CONTRIBUTING.md"
          "CODE_OF_CONDUCT.md"
          "LICENSE"
          "SECURITY.md"
          ".gitignore"
          "MODULE_INDEX.md"
          "FOLDER_STRUCTURE.md"
          "docs/guides/STYLE_GUIDE.md"
          "docs/modules/example-module/README.md"
          ".github/ISSUE_TEMPLATE/bug_report.md"
          ".github/ISSUE_TEMPLATE/feature_request.md"
          ".github/PULL_REQUEST_TEMPLATE.md"
        )

        missing_files=()
        for file in "${required_files[@]}"; do
          if [ ! -f "$file" ]; then
            missing_files+=("$file")
          fi
        done

        if [ ${#missing_files[@]} -ne 0 ]; then
          echo "Error: Missing required files:"
          printf '%s\n' "${missing_files[@]}"
          exit 1
        fi

        echo "All required documentation files are present!"

    - name: Validate file content
      run: |
        echo "Validating file content..."

        # Check README has documentation-specific sections
        if ! grep -q "## Overview" README.md || ! grep -q "Documentation" README.md; then
          echo "Error: README.md missing documentation-specific content"
          exit 1
        fi

        # Check MODULE_INDEX exists and has required sections
        if ! grep -q "## Modules" MODULE_INDEX.md; then
          echo "Error: MODULE_INDEX.md missing required sections"
          exit 1
        fi

        # Check LICENSE contains MIT
        if ! grep -q "MIT License" LICENSE; then
          echo "Error: LICENSE file doesn't contain MIT License"
          exit 1
        fi

        # Check CODE_OF_CONDUCT has required sections
        if ! grep -q "## Our Pledge" CODE_OF_CONDUCT.md; then
          echo "Error: CODE_OF_CONDUCT.md missing required sections"
          exit 1
        fi

        echo "File content validation passed!"

    - name: Validate documentation structure
      run: |
        echo "Validating documentation directory structure..."

        # Check docs directories exist
        required_dirs=(
          "docs"
          "docs/modules"
          "docs/guides"
          "docs/api"
          "docs/architecture"
        )

        for dir in "${required_dirs[@]}"; do
          if [ ! -d "$dir" ]; then
            echo "Error: Required directory $dir does not exist"
            exit 1
          fi
        done

        echo "Documentation structure validation passed!"

    - name: Validate module documentation
      run: |
        echo "Validating module documentation format..."

        # Check that example module exists
        if [ ! -f "docs/modules/example-module/README.md" ]; then
          echo "Error: Example module documentation is missing"
          exit 1
        fi

        # Check for required sections in example module
        example_readme="docs/modules/example-module/README.md"
        required_sections=(
          "## Overview"
          "## Installation"
          "## Quick Start"
          "## Configuration"
          "## Usage"
        )

        for section in "${required_sections[@]}"; do
          if ! grep -q "$section" "$example_readme"; then
            echo "Warning: Example module missing recommended section: $section"
          fi
        done

        echo "Module documentation validation completed!"

  security:
    name: Security Check
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Run security checks
      run: |
        echo "Running basic security checks..."

        # Check for common secrets patterns
        if grep -rE "(password|secret|api[_-]?key|token)\s*=\s*['\"][^'\"]+['\"]" --exclude-dir=.git --exclude="*.md" .; then
          echo "Warning: Potential hardcoded secrets found"
        fi

        echo "Security checks completed!"

  build:
    name: Build Check
    runs-on: ubuntu-latest
    needs: [lint, test]

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Verify template structure
      run: |
        echo "Documentation repository structure verification complete!"
        echo "All checks passed. Repository is ready for collaboration!"
